# BlueZ: teclado e controle Bluetooth (docs/jogos-e-pacotes/07-latencia-e-modo-performance.md)
[General]

# HID no kernel (hidp), não no bluetoothd pelo uhid: cada relatório do controle passava pelo
# bluetoothd, que gastava ~20% da CPU com o DualShock 4 no Big Remote Play (198 tiques em 10 s);
# pelo kernel, 0,1% (7 tiques em 60 s), e a imagem desenhada passou de ~15 para ~39 qps.
# O hid-playstation e a correção do descritor (bfbt-agent --fix-hid) valem igual: o kernel
# recebe o mesmo descritor do bluetoothd.
UserspaceHID=false
