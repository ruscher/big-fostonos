name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  instalador:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependências (GTK 4, Libadwaita, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            python3-pytest xvfb dosfstools desktop-file-utils
      - name: Núcleo e interface do instalador
        working-directory: installer
        run: xvfb-run -a python3 -m pytest -q -p no:cacheprovider tests
      - name: Atalho do menu
        run: desktop-file-validate installer/packaging/br.org.biglinux.BigFostonInstaller.desktop

  protocolo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Protocolo BFP (C do agente x Python) e FSP do Big Screen
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pytest
          make -C src/wince/agent host-test
          python3 -m pytest -q -p no:cacheprovider tests/agent tests/bigscreen
